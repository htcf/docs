site_name: HTCF
theme: 
  name: material
  logo: htcf_rev_sm.png
  favicon: images/favicon.png
  features:
    - navigation.instant
    - toc.integrate
  palette:
    scheme: wustl_red
    
extra_css:
  - stylesheets/extra.css

extra:
  font:
    text: 'Roboto'

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - abbr
  - pymdownx.snippets
  - pymdownx.highlight
  - pymdownx.superfences
  - attr_list
  - def_list
  - meta
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - macros:
      verbose: false
  - search
  
extra:
  lts:
    price: 11.61
  ref:
    price: 3.87

